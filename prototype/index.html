<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Apex Win｜娛樂城 H5 Prototype（Demo）</title>

  <!-- PWA（#14）：可安裝 + 離線載入。SW 僅在 http(s)/localhost 生效，file:// 自動略過 -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#131312" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Apex Win" />

  <link rel="apple-touch-icon" href="./icon.svg" />

  <!-- 純前端 H5 Prototype：無後端、無資料庫、無建置工具，可直接以瀏覽器開啟 -->
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/components.css" />
</head>
<body>
  <div id="app" aria-busy="true"></div>

  <!--
    classic script + window.HL 全域命名空間。
    原因：本機無 Node / 無可用 Python 靜態伺服器，需支援
    直接用瀏覽器開啟 index.html（file://），避免 ES module 被 CORS 阻擋。
    載入順序代表相依關係，不可任意調換。
  -->
  <!-- Supabase JS SDK（UMD：window.supabase）；未設定 creds 時不使用，維持 Demo 模式 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./src/core/dom.js"></script>
  <!-- 站別模式（真站/假站）：決定 localStorage 命名空間與開機種子，須在 dom 之後、mock/state/config 之前 -->
  <script src="./src/core/site-mode.js"></script>
  <script src="./src/data/mock-data.js"></script>
  <!-- 遊戲登錄表（單一來源 + 動態註冊；seed 自 mock-data，須在其後、views 之前） -->
  <script src="./src/data/games.js"></script>
  <script src="./src/core/app-state.js"></script>
  <!-- 後端資料服務層（在 state 之後、ui/views 之前） -->

  <script src="./src/core/i18n.js"></script>

  <!-- 注單／投注歷史中心（#51）：掛中央結算點落地逐局紀錄。
       置於 selftest 之後＝載入時即可 register 自身測項；HL.fair(info/isPF) 與 HL.ui 皆為執行期取用。 -->
  <script src="./src/core/betlog.js"></script>
  <!-- 遊戲上架排程 × 受眾分層（#54）：須在 promo-cal.js 之後（宣告時 register 進活動日曆）
       與 selftest.js 之後（載入即 register 自身測項）；HL.games/HL.vip/HL.season/HL.guild 皆執行期取用。 -->
  <script src="./src/core/release.js"></script>
  <!-- 負責任博弈（#67）：限額型別註冊表 + 下注前閘 + 冷靜期/現實檢查。置於 selftest 之後（載入即 register
       自身測項）；HL.dom/HL.state/HL.ui/HL.notify/HL.i18n 皆執行期取用，故不需再往後排。 -->
  <script src="./src/core/responsible.js"></script>
  <!-- 成本加權進度引擎（#50）：每遊戲 edge 係數 config 表 → VIP／賽季經驗加權。
       同樣置於 selftest 之後＝載入時即 register 自身測項；HL.site/HL.games/HL.ui 皆為執行期取用。 -->
  <script src="./src/core/edge.js"></script>
  <!-- 進度來源註冊表（#65）：把「什麼行為換多少進度」收成一張表，VIP／賽季進度改由單一出口 grant() 餵入。
       置於 selftest.js 之後（載入即 register 自身測項）與 edge.js 之後（同族、閱讀上相鄰）；
       HL.vip/HL.season/HL.site/HL.ui/HL.dom 皆執行期取用，故不需再往後排。
       ⚠️ liveStats.record 在 grant 不存在時會回退舊直呼路徑＝漏載只退化、不會整組沒進度。 -->
  <script src="./src/core/progress-src.js"></script>
  <!-- VIP 服務水準軸（#63）：分階提領時效／日・週・月額度／客服層級的可註冊維度表 + 提款前閘。
       置於 selftest 之後（載入即 register 自身測項）；HL.vip/HL.site/HL.ui/HL.dom 皆執行期取用。 -->
  <script src="./src/core/service-level.js"></script>
  <!-- 揭曉型領獎元件（#38）+ 里程碑揭曉層（#66）：**2026-08-06 由 shop.js 之前移到此處**——原位置在
       selftest.js 之前，#66 新增的 4 個測項因此在瀏覽器端整組註冊不到（node 有、瀏覽器沒有＝兩端不同步）。
       本檔只定義 HL.reveal，所有呼叫端（meta/onboarding/shop/progress/season/achievements）皆執行期取用，
       故往後移零風險。 -->

  <!-- PWA Service Worker 註冊（僅 http/https；file:// 不支援 SW，略過不報錯） -->
  <script>
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function (e) { if (window.console) console.warn("[Apex Win] SW 註冊失敗：", e); });
      });
    }
