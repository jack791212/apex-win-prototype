    直接用瀏覽器開啟 index.html（file://），避免 ES module 被 CORS 阻擋。

  -->
  <!-- Supabase JS SDK（UMD：window.supabase）；未設定 creds 時不使用，維持 Demo 模式 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./src/core/dom.js"></script>
  <!-- #72 說明中心註冊表：必須早於**所有**「自己註冊自己說明」的模組（fair/progress/edge/responsible/
       service-level/bonus-ttl/challenges/referral/game-axes），否則那些模組的軟依賴守衛
       `if (HL.support && HL.support.register)` 會靜默略過＝容器做好卻沒人上架。
       ⚠️ 2026-08-18（#106）由 ui.js 之後上移到這裡：原位置在 game-axes.js(#94/#102) **之後**，
       而 game-axes 是 views/casino.js 的相依必須早載 ⇒ 它想註冊也註冊不到（同 #66/#101「排在註冊表
       之前＝整組靜默不註冊」那個坑的第三次）。本檔載入期只取 HL.dom.el（HL.ui/HL.i18n 都是開面板時
       才用），故只需排在 dom.js 之後；擺這裡讓「早於所有註冊者」成為結構保證，而不是每加一個模組都要重想一次。 -->
  <script src="./src/core/support.js"></script>
  <!-- 站別模式（真站/假站）：決定 localStorage 命名空間與開機種子，須在 dom 之後、mock/state/config 之前 -->
  <script src="./src/core/site-mode.js"></script>
  <!-- #90 經濟旋鈕自我描述層：純登記表，須早於所有經濟表（rewards/rakeback-core/cashback/safetynet/rakeboost/edge/progress-src/service-level）才接得到它們的註冊 -->

  <script src="./src/data/mock-data.js"></script>
  <!-- 遊戲登錄表（單一來源 + 動態註冊；seed 自 mock-data，須在其後、views 之前） -->

  <script src="./src/data/game-rtp.js"></script>

  <!-- 負責任博弈（#67）：限額型別註冊表 + 下注前閘 + 冷靜期/現實檢查。置於 selftest 之後（載入即 register
       自身測項）；HL.dom/HL.state/HL.ui/HL.notify/HL.i18n 皆執行期取用，故不需再往後排。 -->
  <script src="./src/core/responsible.js"></script>
  <!-- 成本加權進度引擎（#50）：每遊戲 edge 係數 config 表 → VIP／賽季經驗加權。
       同樣置於 selftest 之後＝載入時即 register 自身測項；HL.site/HL.games/HL.ui 皆為執行期取用。 -->
  <script src="./src/core/edge.js"></script>
  <!-- 進度來源註冊表（#65）：把「什麼行為換多少進度」收成一張表，VIP／賽季進度改由單一出口 grant() 餵入。
       置於 selftest.js 之後（載入即 register 自身測項）與 edge.js 之後（同族、閱讀上相鄰）；
       HL.vip/HL.season/HL.site/HL.ui/HL.dom 皆執行期取用，故不需再往後排。
       ⚠️ liveStats.record 在 grant 不存在時會回退舊直呼路徑＝漏載只退化、不會整組沒進度。 -->
  <script src="./src/core/progress-src.js"></script>
  <!-- 近 30 天活躍度滾動視窗（#59）：環形日桶（真實押注／edge 加權 XP 兩把尺）+ 額外「光環」層。
       **必須排在 progress-src.js 之後**——本檔載入當下就呼叫 `HL.progressSrc.registerBoost`
       登記光環加速（第三個註冊者）；排在它之前會靜默漏掉整層效果（＝#66／#101／#106 同一個坑的形狀，
       故此處把理由寫下來而不是靠記得）。**#108 起同時要求排在 rakeboost.js（第 100 行）之後**——
       本檔載入當下也會呼叫 `HL.rakeboost.register` 登記光環的返水加成（該表第五筆）；
       同上，排在它之前只是靜默少一筆加成（返水回到基準、不拋錯），故兩處都帶 `&&` 守衛。
       其餘依賴（HL.vip／HL.site／HL.dom／HL.ui／HL.support／
       HL.econCfg）皆執行期取用或已更早載入。liveStats.record 對本檔帶 `HL.activity` 守衛
       ⇒ 漏載只是沒有光環，不影響任何既有進度。 -->
  <script src="./src/core/activity.js"></script>
  <!-- VIP 服務水準軸（#63）：分階提領時效／日・週・月額度／客服層級的可註冊維度表 + 提款前閘。
       置於 selftest 之後（載入即 register 自身測項）；HL.vip/HL.site/HL.ui/HL.dom 皆執行期取用。 -->
  <script src="./src/core/service-level.js"></script>
  <!-- 紅利壽命軸（#71）：依送幣來源註冊的 TTL 表，progress.js 的 badd 授予當下求值一次寫進 entry。
       **刻意放在 selftest.js 之後而非 progress.js 之前**——首版放在 progress.js 前，5 個測項因此
       只在 node 註冊得到、瀏覽器端整組收不到（正是上面 reveal.js 那條註記的同型陷阱，08-17 08:00 窗自查抓到）。
       〔#101 後記：該陷阱已由 HL._selftestQ 佇列根治，本檔現在排哪裡測項都收得到；位置維持不變的
        理由改為下面這條 fail-safe 論證。〕
       progress.js 對 HL.bonusTtl 一律**執行期取用且帶 !HL.bonusTtl 退化守衛**（查不到＝不到期＝改版前行為），
       故往後移的唯一代價是「開機到本檔載入之間若有送幣，該筆不帶壽命」＝fail-safe 方向。 -->
  <script src="./src/core/bonus-ttl.js"></script>

       selftest.js 之前，#66 新增的 4 個測項因此在瀏覽器端整組註冊不到（node 有、瀏覽器沒有＝兩端不同步）。
       本檔只定義 HL.reveal，所有呼叫端（meta/onboarding/shop/progress/season/achievements）皆執行期取用，

       須在 games.js 之後（用 HL.games.register）、main.js 之前（大廳渲染前 stub 要就位）。 -->
